<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141517">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <title>Lift Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <div id="rest" hidden role="timer" aria-live="off">
    <div class="rest-fill"></div>
    <div class="rest-main">
      <div class="rest-left">
        <span class="rest-label" id="rest-label">Rest</span>
        <span id="rest-time" class="rest-time">0:00</span>
      </div>
      <span class="rest-btns">
        <button data-r="-15" aria-label="15 seconds less">−15</button>
        <button data-r="15" aria-label="15 seconds more">+15</button>
        <button data-r="skip">Skip</button>
      </span>
    </div>
    <div class="rest-next" id="rest-next"></div>
  </div>

  <nav id="tabs" aria-label="Sections">
    <button data-tab="train">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v4M5 7v10M8 9v6h8V9M16 12H8M19 7v10M22 10v4"/></svg>
      <span>Train</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>History</span>
    </button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>Exercises</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <dialog id="sheet"><div id="sheet-body" tabindex="-1" autofocus></div></dialog>
  <div id="toast" role="status"></div>

  <script src="plans.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
